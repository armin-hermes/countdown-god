name: Deploy countdown-god to Cloudflare Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -f public/index.html
          grep -q 'dir="rtl"' public/index.html
          grep -q 'god.study' public/index.html
          ls -lh public/index.html

      - name: Create Pages project and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages project create konkur-clock --production-branch=main || true
          npx -y wrangler@latest pages deploy public --project-name=konkur-clock --branch=main --commit-dirty=true
